<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>إثبتلي | لوحة المشروع</title>
  <style>
    :root { --brown:#3f5a3a; --cream:#eef2e6; --text:#2b1c12; --line:#d9c7b0; --danger:#b42318; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:"Segoe UI", Tahoma, sans-serif; background:var(--cream); color:var(--text); }
    .topbar { background:var(--brown); color:#f7efe4; font-size:13px; padding:8px 20px; display:flex; justify-content:space-between; }
    .hero { background:#f7f1e6; padding:18px 20px; }
    .hero-inner, .wrap, .nav-inner { max-width:980px; margin:0 auto; }
    .hero-inner { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .hero h1 { margin:0; color:var(--brown); }
    .hero p { margin:4px 0 0; color:#8a6240; }
    .nav { background:var(--brown); }
    .nav-inner { padding:10px 20px; color:#fff; }
    .wrap { padding:24px 16px 40px; }
    .card { background:#fffaf2; border:1px solid var(--line); padding:18px; margin:16px 0; }
    input, textarea, button { width:100%; padding:12px; border:1px solid var(--line); font:inherit; margin:8px 0; }
    button { background:var(--brown); color:#fff; border:0; font-weight:700; cursor:pointer; }
    button.danger { background:var(--danger); }
    button.secondary { background:#8a6240; color:#fff; }
    .item { display:grid; grid-template-columns:180px 1fr; gap:14px; border-top:1px solid var(--line); padding-top:14px; margin-top:14px; }
    .item img { width:180px; height:180px; object-fit:cover; }
    .hidden { display:none; }
    .notice { background:#f4e6cf; border:1px solid #e2c9a4; padding:12px; }
    footer { background:var(--brown); color:#ead9c4; padding:18px 16px; }
    footer h3 { color:#fff; margin:0 0 8px; }
  </style>
</head>
<body>
  <div class="topbar">
    <span>مشروع جامعي</span>
    <span>لوحة المراجعة</span>
  </div>
  <div class="hero">
    <div class="hero-inner">
      <div>
        <h1>إثبتلي</h1>
        <p>لوحة مراجعة الطلبات</p>
      </div>
      <img src="logo.png" alt="إثبتلي" style="height:58px;">
    </div>
  </div>
  <div class="nav"><div class="nav-inner">الرئيسية | الطلبات | خروج</div></div>
  <div class="wrap">
    <div class="notice">دخول المشرف بالإيميل فقط. الطلبات تعرض الاسم والرقم الجامعي والجوال والصورة.</div>
    <div id="authCard" class="card">
      <input id="email" type="email" placeholder="إيميل المشرف" />
      <input id="password" type="password" placeholder="كلمة المرور" />
      <button id="loginBtn">دخول</button>
      <div id="authMsg" style="color:#b42318;"></div>
    </div>
    <div id="appCard" class="card hidden">
      <p id="who"></p>
      <button id="logoutBtn" class="secondary">خروج</button>
      <div id="list"></div>
    </div>
  </div>
  <footer>
    <h3>نبذة</h3>
    <div>منصة جامعية لمراجعة الملفات المرفقة وإرسال الرد للطالب.</div>
  </footer>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
    import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";
    import { getFirestore, collection, query, orderBy, onSnapshot, doc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

    const ADMIN_EMAIL = "pvtremas16@gmail.com";
    const firebaseConfig = {
      apiKey: "AIzaSyDj5Hr4ONRDgEJLgRMExcYXnJnrS20ge_k",
      authDomain: "ethbatli.firebaseapp.com",
      projectId: "ethbatli",
      storageBucket: "ethbatli.firebasestorage.app",
      messagingSenderId: "824449568013",
      appId: "1:824449568013:web:f606ccd14e23463b763444",
      measurementId: "G-V5BRB4MRVQ"
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    document.getElementById("loginBtn").onclick = async () => {
      try { await signInWithEmailAndPassword(auth, email.value, password.value); }
      catch (e) { authMsg.textContent = e.message; }
    };
    document.getElementById("logoutBtn").onclick = () => signOut(auth);

    async function review(id, status) {
      const reply = document.getElementById("reply-" + id).value;
      await updateDoc(doc(db, "submissions", id), {
        status,
        adminReply: reply || (status === "approved" ? "تمت الموافقة" : "مرفوض"),
        reviewedAt: serverTimestamp()
      });
    }
    window.review = review;

    let unsub = null;
    onAuthStateChanged(auth, (user) => {
      if (unsub) unsub();
      if (!user || user.email !== ADMIN_EMAIL) {
        authCard.classList.remove("hidden");
        appCard.classList.add("hidden");
        if (user && user.email !== ADMIN_EMAIL) authMsg.textContent = "هذا ليس حساب المشرف";
        return;
      }
      authCard.classList.add("hidden");
      appCard.classList.remove("hidden");
      who.textContent = "مشرف: " + user.email;
      const q = query(collection(db, "submissions"), orderBy("createdAt", "desc"));
      unsub = onSnapshot(q, (snap) => {
        list.innerHTML = "";
        snap.forEach((d) => {
          const x = d.data();
          list.innerHTML += `<div class="item"><img src="${x.imageUrl}" alt=""><div>
            <p><b>الاسم:</b> ${x.fullName || "-"}</p>
            <p><b>الرقم الجامعي:</b> ${x.universityId || "-"}</p>
            <p><b>الجوال:</b> ${x.phone || "-"}</p>
            <p><b>الحالة:</b> ${x.status}</p>
            <p>${x.note || ""}</p>
            <textarea id="reply-${d.id}">${x.adminReply || ""}</textarea>
            <button onclick="review('${d.id}','approved')">موافقة</button>
            <button class="danger" onclick="review('${d.id}','rejected')">رفض</button>
          </div></div>`;
        });
        if (!snap.size) list.innerHTML = "<p>لا توجد طلبات</p>";
      });
    });
  </script>
</body>
</html>
