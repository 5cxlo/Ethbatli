<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة التحكم الفنية | منصة إثبتلي</title>
  <style>
    :root {
      --primary-green: #1c422b;
      --card-bg: #ffffff;
      --border-color: #e2dcd0;
      --danger: #b42318;
      --success: #15803d;
    }
    body { font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f2ec; padding: 20px; direction: rtl; }
    .container { max-width: 1000px; margin: 0 auto; }
    .header { background: var(--primary-green); color: #fff; padding: 18px 24px; border-radius: 8px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
    .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; margin-bottom: 20px; }
    .doc-img { max-width: 100%; max-height: 400px; border: 1px solid var(--border-color); border-radius: 6px; margin-top: 10px; }
    textarea { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; font-family: inherit; margin-top: 8px; }
    .btn-group { display: flex; gap: 10px; margin-top: 12px; }
    button { padding: 10px 18px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-family: inherit; }
    .btn-approve { background: var(--success); color: white; }
    .btn-reject { background: var(--danger); color: white; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h2>لوحة الفحص والمصادقة الفنية - إثبتلي</h2>
      <span>المشرف الفني</span>
    </div>
    <div id="submissionsList">جاري تحميل المستندات بانتظار التوثيق...</div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
    import { getFirestore, collection, query, orderBy, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDj5Hr4ONRDgEJLgRMExcYXnJnrS20ge_k",
      authDomain: "ethbatli.firebaseapp.com",
      projectId: "ethbatli",
      storageBucket: "ethbatli.firebasestorage.app",
      messagingSenderId: "824449568013",
      appId: "1:824449568013:web:f606ccd14e23463b763444",
      measurementId: "G-V5BRB4MRVQ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    function generateSerialNumber() {
      const randomHex = Math.floor(100000 + Math.random() * 900000).toString(16).toUpperCase();
      return `ETH-2026-${randomHex}`;
    }

    const q = query(collection(db, "submissions"), orderBy("createdAt", "desc"));
    onSnapshot(q, (snap) => {
      const container = document.getElementById("submissionsList");
      container.innerHTML = "";
      snap.forEach((d) => {
        const x = d.data();
        const id = d.id;

        container.innerHTML += `
          <div class="card">
            <h3>مستند مقدم من: ${x.fullName || "غير محدد"} (${x.phone || "-"})</h3>
            <p><b>رقم الهوية/الإقامة:</b> ${x.universityId || "-"}</p>
            <p><b>ملاحظة الطالب:</b> ${x.note || "-"}</p>
            <p><b>الحالة الحالية:</b> ${x.status}</p>
            ${x.serialNumber ? `<p><b>الرقم التسلسلي الصادر:</b> ${x.serialNumber}</p>` : ''}
            <img class="doc-img" src="${x.imageUrl}" />
            
            <textarea id="reply_${id}" placeholder="اكتب الملاحظة أو سبب القرار الفني...">${x.adminReply || ""}</textarea>
            
            <div class="btn-group">
              <button class="btn-approve" onclick="updateStatus('${id}', 'approved')">اعتماد وإصدار الرقم التسلسلي ✅</button>
              <button class="btn-reject" onclick="updateStatus('${id}', 'rejected')">رفض المستند ❌</button>
            </div>
          </div>
        `;
      });
      if(!snap.size) container.innerHTML = "لا توجد مستندات بانتظار الفحص.";
    });

    window.updateStatus = async (id, status) => {
      const reply = document.getElementById(`reply_${id}`).value;
      const ref = doc(db, "submissions", id);
      const updateData = {
        status: status,
        adminReply: reply
      };

      if (status === "approved") {
        updateData.serialNumber = generateSerialNumber();
      }

      await updateDoc(ref, updateData);
      alert("تم تحديث حالة المستند وإصدار التوثيق بنجاح!");
    };
  </script>
</body>
</html>
