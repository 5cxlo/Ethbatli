<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة التحكم الإدارية | أثبت لي</title>
  <style>
    :root { --primary-green:#1c422b; --light-green:#eaf1ec; --bg-beige:#f6f4ee; --card-bg:#fff; --border-color:#e2dcd0; --text-main:#1a251c; --danger:#b42318; --success:#15803d; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:"Segoe UI",Tahoma,Geneva,Verdana,sans-serif; background:var(--bg-beige); color:var(--text-main); line-height:1.6; }
    .top-bar { background:var(--primary-green); color:#d4e5d8; font-size:12px; padding:8px 24px; }
    .main-header { background:#fcfbf9; border-bottom:2px solid var(--border-color); padding:16px 24px; }
    .header-container { max-width:1200px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; }
    .content-wrapper { max-width:1200px; margin:24px auto; padding:0 16px; }
    .card-box { background:var(--card-bg); border:1px solid var(--border-color); border-radius:8px; padding:24px; margin-bottom:20px; }
    input,textarea,button { width:100%; padding:12px; border:1px solid var(--border-color); border-radius:6px; font-family:inherit; margin-top:8px; margin-bottom:12px; }
    button.btn-primary { background:var(--primary-green); color:#fff; border:0; font-weight:700; cursor:pointer; }
    button.btn-success { background:var(--success); color:#fff; border:0; font-weight:700; cursor:pointer; }
    button.btn-danger { background:var(--danger); color:#fff; border:0; font-weight:700; cursor:pointer; }
    button.btn-secondary { background:#6b7c6e; color:#fff; border:0; font-weight:600; cursor:pointer; }
    .admin-request-card { background:#faf9f6; border:1px solid var(--border-color); border-radius:8px; padding:20px; margin-bottom:20px; }
    .req-grid { display:grid; grid-template-columns:1fr 2fr; gap:20px; }
    @media (max-width:700px){ .req-grid{grid-template-columns:1fr;} }
    .locked-notice { background:#fff3cd; color:#856404; padding:10px; border-radius:6px; font-weight:bold; border:1px solid #ffeeba; margin-top:10px; text-align:center; }
    .role-badge { display:inline-block; padding:4px 10px; border-radius:4px; font-size:12px; font-weight:bold; background:var(--light-green); color:var(--primary-green); border:1px solid var(--primary-green); margin-bottom:10px; }
    .hidden { display:none !important; }
    .gov-footer { background:var(--primary-green); color:#d4e5d8; text-align:center; padding:20px; margin-top:40px; font-size:12px; }
  </style>
</head>
<body>
  <div class="top-bar"><span>نظام المشرفين الإداري - منصة أثبت لي (نموذج تجريبي)</span></div>
  <header class="main-header">
    <div class="header-container">
      <h2>لوحة الإدارة وصلاحيات التدقيق</h2>
      <button id="adminLogoutBtn" class="btn-secondary hidden" style="width:auto;padding:8px 16px;">تسجيل الخروج</button>
    </div>
  </header>
  <div class="content-wrapper">
    <div id="adminLoginCard" class="card-box">
      <h3>تسجيل دخول المشرفين</h3>
      <input id="adminEmail" type="email" placeholder="البريد الإلكتروني" />
      <input id="adminPassword" type="password" placeholder="كلمة المرور" />
      <button id="adminLoginBtn" class="btn-primary">دخول</button>
      <div id="adminLoginMsg" style="color:var(--danger);font-weight:bold;"></div>
    </div>
    <div id="adminDashboard" class="card-box hidden">
      <div id="adminInfoContainer"></div>
      <h3>قائمة الطلبات</h3>
      <div id="adminRequestsList"></div>
    </div>
  </div>
  <footer class="gov-footer">جميع الحقوق محفوظة © منصة أثبت لي 2026 · مشروع تجريبي غير تابع لأي جهة حكومية</footer>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";
    import { getFirestore, collection, query, orderBy, onSnapshot, doc, getDoc, writeBatch, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    function generateSecureSerialNumber() {
      const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      const rnd = new Uint32Array(10);
      crypto.getRandomValues(rnd);
      let s = "";
      for (let i = 0; i < 10; i++) { s += chars[rnd[i] % chars.length]; if (i === 4) s += "-"; }
      return "ETHB-" + s;
    }
    const firebaseConfig = {
      apiKey: "AIzaSyDj5Hr4ONRDgEJLgRMExcYXnJnrS20ge_k",
      authDomain: "ethbatli.firebaseapp.com",
      projectId: "ethbatli",
      storageBucket: "ethbatli.firebasestorage.app",
      messagingSenderId: "824449568013",
      appId: "1:824449568013:web:f606ccd14e23463b763444",
      measurementId: "G-V5BRB4MRVQ"
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    let currentAdminRole = "auditor";
    let unsubAdmin = null;
    const loginMsg = document.getElementById("adminLoginMsg");
    document.getElementById("adminLoginBtn").onclick = async () => {
      loginMsg.textContent = "";
      try {
        await signInWithEmailAndPassword(auth, document.getElementById("adminEmail").value.trim(), document.getElementById("adminPassword").value);
      } catch (e) { loginMsg.textContent = "فشل تسجيل الدخول: " + e.message; }
    };
    document.getElementById("adminLogoutBtn").onclick = () => signOut(auth);
    function showLogin() {
      if (unsubAdmin) { unsubAdmin(); unsubAdmin = null; }
      document.getElementById("adminLoginCard").classList.remove("hidden");
      document.getElementById("adminDashboard").classList.add("hidden");
      document.getElementById("adminLogoutBtn").classList.add("hidden");
    }
    onAuthStateChanged(auth, async (user) => {
      if (!user || !user.email) { showLogin(); return; }
      let adminSnap = null;
      try { adminSnap = await getDoc(doc(db, "admins", user.email)); } catch (err) {}
      if (!adminSnap || !adminSnap.exists()) {
        showLogin();
        loginMsg.textContent = "هذا الحساب ليس مشرفًا.";
        return;
      }
      currentAdminRole = adminSnap.data().role || "auditor";
      document.getElementById("adminLoginCard").classList.add("hidden");
      document.getElementById("adminDashboard").classList.remove("hidden");
      document.getElementById("adminLogoutBtn").classList.remove("hidden");
      const roleNameAr = currentAdminRole === "super_admin" ? "مشرف عام" : "مدقق ميداني";
      document.getElementById("adminInfoContainer").innerHTML = `<div class="role-badge">صلاحيتك: ${roleNameAr}</div>`;
      if (unsubAdmin) unsubAdmin();
      unsubAdmin = onSnapshot(query(collection(db, "submissions"), orderBy("createdAt", "desc")), (snap) => {
        const list = document.getElementById("adminRequestsList");
        list.innerHTML = "";
        snap.forEach((docSnap) => {
          const data = docSnap.data();
          const id = esc(docSnap.id);
          const isProcessed = data.status === "approved" || data.status === "rejected";
          let actionArea = "";
          if (isProcessed) actionArea = `<div class="locked-notice">تم اتخاذ قرار نهائي</div>`;
          else if (currentAdminRole === "super_admin") actionArea = `
            <textarea id="reply_${id}" placeholder="ملاحظة...">${esc(data.adminReply || "")}</textarea>
            <div style="display:flex;gap:10px;">
              <button class="btn-success" data-id="${id}" onclick="approveDocument(this.dataset.id)">اعتماد</button>
              <button class="btn-danger" data-id="${id}" onclick="rejectDocument(this.dataset.id)">رفض</button>
            </div>`;
          else actionArea = `<div style="background:#f0f2f5;padding:8px;text-align:center;">صلاحياتك لا تسمح بالاعتماد</div>`;
          list.innerHTML += `
            <div class="admin-request-card"><div class="req-grid">
              <div><img src="${esc(data.imageUrl)}" alt="المستند" style="max-width:100%;border-radius:6px;" /></div>
              <div>
                <p><b>المستفيد:</b> ${esc(data.fullName || "-")}</p>
                <p><b>الحالة:</b> ${esc(data.status)}</p>
                <p><b>الرقم التسلسلي:</b> ${esc(data.serialNumber || "لم يصدر")}</p>
                <p><b>ملاحظة المستخدم:</b> ${esc(data.note || "-")}</p>
                <p><b>الفحص الآلي:</b> ${esc(data.aiReport?.isAiGenerated || "-")} (جودة: ${esc(data.aiReport?.score || "-")})</p>
                ${actionArea}
              </div>
            </div></div>`;
        });
      });
    });
    window.approveDocument = async (id) => {
      if (currentAdminRole !== "super_admin") { alert("لا تملك صلاحية الاعتماد"); return; }
      try {
        const ref = doc(db, "submissions", id);
        const snap = await getDoc(ref);
        const d = snap.data();
        if (!d || d.status !== "pending") { alert("هذا الطلب تمت معالجته مسبقًا"); return; }
        const serial = generateSecureSerialNumber();
        const batch = writeBatch(db);
        batch.update(ref, { status: "approved", serialNumber: serial, adminReply: document.getElementById(`reply_${id}`)?.value || "تم الاعتماد" });
        batch.set(doc(db, "verifications", serial), { status: "approved", imageUrl: d.imageUrl, approvedAt: serverTimestamp() });
        await batch.commit();
        alert("تم الاعتماد بنجاح");
      } catch (e) { alert("تعذر الاعتماد: " + e.message); }
    };
    window.rejectDocument = async (id) => {
      if (currentAdminRole !== "super_admin") { alert("لا تملك صلاحية الرفض"); return; }
      try {
        await updateDoc(doc(db, "submissions", id), { status: "rejected", adminReply: document.getElementById(`reply_${id}`)?.value || "تم الرفض" });
        alert("تم الرفض");
      } catch (e) { alert("تعذر الرفض: " + e.message); }
    };
  </script>
</body>
</html>
