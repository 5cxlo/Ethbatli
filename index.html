<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة التحكم الإدارية المتقدمة | إثبتلي</title>
  <style>
    :root {
      --primary-green: #1c422b;
      --accent-green: #295a3c;
      --light-green: #eaf1ec;
      --bg-beige: #f6f4ee;
      --card-bg: #ffffff;
      --border-color: #e2dcd0;
      --gold-accent: #c5a059;
      --text-main: #1a251c;
      --text-muted: #5c685d;
      --danger: #b42318;
      --success: #15803d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-beige); color: var(--text-main); line-height: 1.6; }
    .top-bar { background-color: var(--primary-green); color: #d4e5d8; font-size: 12px; padding: 8px 24px; display: flex; justify-content: space-between; align-items: center; }
    .main-header { background: #fcfbf9; border-bottom: 2px solid var(--border-color); padding: 16px 24px; }
    .header-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
    .content-wrapper { max-width: 1200px; margin: 24px auto; padding: 0 16px; }
    .card-box { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 24px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
    input, textarea, button { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 6px; font-family: inherit; margin-top: 8px; margin-bottom: 12px; }
    button.btn-primary { background: var(--primary-green); color: #fff; border: 0; font-weight: 700; cursor: pointer; }
    button.btn-success { background: var(--success); color: #fff; border: 0; font-weight: 700; cursor: pointer; }
    button.btn-danger { background: var(--danger); color: #fff; border: 0; font-weight: 700; cursor: pointer; }
    button.btn-secondary { background: #6b7c6e; color: #fff; border: 0; font-weight: 600; cursor: pointer; }
    .admin-request-card { background: #faf9f6; border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; margin-bottom: 20px; }
    .req-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; }
    .locked-notice { background: #fff3cd; color: #856404; padding: 10px; border-radius: 6px; font-weight: bold; border: 1px solid #ffeeba; margin-top: 10px; text-align: center; }
    .hidden { display: none !important; }
    .gov-footer { background: var(--primary-green); color: #d4e5d8; text-align: center; padding: 20px; margin-top: 40px; font-size: 12px; }
  </style>
</head>
<body>
  <div class="top-bar">
    <span>نظام المشرفين الإداري الآمن - منصة إثبتلي</span>
  </div>

  <header class="main-header">
    <div class="header-container">
      <h2>لوحة الإدارة وصلاحيات التدقيق</h2>
      <button id="adminLogoutBtn" class="btn-secondary hidden" style="width: auto; padding: 8px 16px;">تسجيل الخروج</button>
    </div>
  </header>

  <div class="content-wrapper">
    <div id="adminLoginCard" class="card-box">
      <h3>تسجيل دخول المشرفين المعتمدين</h3>
      <input id="adminEmail" type="email" placeholder="البريد الإلكتروني الإداري" />
      <input id="adminPassword" type="password" placeholder="كلمة المرور" />
      <button id="adminLoginBtn" class="btn-primary">دخول آمن</button>
      <div id="adminLoginMsg" style="color:var(--danger); font-weight: bold;"></div>
    </div>

    <div id="adminDashboard" class="card-box hidden">
      <h3>إدارة وقائمة الطلبات الواردة</h3>
      <div id="adminRequestsList"></div>
    </div>
  </div>

  <footer class="gov-footer">جميع الحقوق محفوظة © منصة إثبتلي الرقمية 2026</footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";
    import { getFirestore, collection, query, orderBy, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDj5Hr4ONRDgEJLgRMExcYXnJnrS20ge_k",
      authDomain: "ethbatli.firebaseapp.com",
      projectId: "ethbatli",
      storageBucket: "ethbatli.firebasestorage.app",
      messagingSenderId: "824449568013",
      appId: "1:824449568013:web:f606ccd14e23463b763444",
      measurementId: "G-V5BRB4MRVQ"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    document.getElementById("adminLoginBtn").onclick = async () => {
      try {
        await signInWithEmailAndPassword(auth, document.getElementById("adminEmail").value, document.getElementById("adminPassword").value);
        document.getElementById("adminLoginMsg").textContent = "";
      } catch (e) {
        document.getElementById("adminLoginMsg").textContent = "فشل المصادقة الإدارية.";
      }
    };

    document.getElementById("adminLogoutBtn").onclick = () => signOut(auth);

    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById("adminLoginCard").classList.add("hidden");
        document.getElementById("adminDashboard").classList.remove("hidden");
        document.getElementById("adminLogoutBtn").classList.remove("hidden");

        onSnapshot(query(collection(db, "submissions"), orderBy("createdAt", "desc")), (snap) => {
          const list = document.getElementById("adminRequestsList");
          list.innerHTML = "";
          snap.forEach((docSnap) => {
            const data = docSnap.data();
            const id = docSnap.id;
            
            // تحقق ما إذا كان الطلب قد تم البت فيه نهائياً (معتمد أو مرفوض)
            const isProcessed = data.status === "approved" || data.status === "rejected";

            let actionArea = "";
            if (isProcessed) {
              // إذا تمت معالجة الطلب، نقوم بقفله وإظهار حالة الإنجاز بدلاً من أزرار التعديل
              actionArea = `
                <div class="locked-notice">
                  🔒 تم اتخاذ قرار نهائي بشأن هذا الطلب (${data.status === 'approved' ? 'معتمد' : 'مرفوض'}) ولا يمكن تعديله.
                </div>
                <p style="margin-top:8px;"><b>الرد المسجل:</b> ${data.adminReply || "لا توجد ملاحظات إضافية"}</p>
              `;
            } else {
              // إذا كان الطلب جديداً (قيد الانتظار)، تظهر أزرار القبول والرفض لمرة واحدة فقط
              actionArea = `
                <textarea id="reply_${id}" placeholder="اكتب ملاحظة أو توجيه للمستخدم هنا...">${data.adminReply || ""}</textarea>
                <div style="display:flex; gap:10px;">
                  <button class="btn-success" onclick="approveDocument('${id}')">اعتماد رسمي وتوليد رقم تسلسلي</button>
                  <button class="btn-danger" onclick="rejectDocument('${id}')">رفض الطلب</button>
                </div>
              `;
            }

            list.innerHTML += `
              <div class="admin-request-card">
                <div class="req-grid">
                  <div><img src="${data.imageUrl}" style="max-width:100%; border-radius:6px;" /></div>
                  <div>
                    <p><b>المستفيد:</b> ${data.fullName || "-"} (${data.universityId || "-"})</p>
                    <p><b>رقم الجوال:</b> ${data.phone || "-"}</p>
                    <p><b>ملاحظة المتقدم:</b> ${data.note || "لا توجد ملاحظات"}</p>
                    <p><b>الحالة الحالية:</b> <span style="color:${data.status === 'approved' ? 'var(--success)' : (data.status === 'rejected' ? 'var(--danger)' : 'var(--gold-accent)}')">${data.status === 'approved' ? 'معتمد ✅' : (data.status === 'rejected' ? 'مرفوض ❌' : 'قيد الانتظار ⏳')}</span></p>
                    <p><b>الرقم التسلسلي:</b> ${data.serialNumber || "لم يصدر بعد"}</p>
                    ${actionArea}
                  </div>
                </div>
              </div>`;
          });
        });
      } else {
        document.getElementById("adminLoginCard").classList.remove("hidden");
        document.getElementById("adminDashboard").classList.add("hidden");
        document.getElementById("adminLogoutBtn").classList.add("hidden");
      }
    });

    window.approveDocument = async (id) => {
      const serialNumber = `ETH-2026-${Math.floor(100000 + Math.random() * 900000)}`;
      await updateDoc(doc(db, "submissions", id), {
        status: "approved",
        serialNumber: serialNumber,
        adminReply: document.getElementById(`reply_${id}`).value || "تم تدقيق واعتماد المستند بنجاح."
      });
      alert("تم اعتماد الطلب نهائياً وتوليد الرقم التسلسلي بنجاح.");
    };

    window.rejectDocument = async (id) => {
      await updateDoc(doc(db, "submissions", id), {
        status: "rejected",
        adminReply: document.getElementById(`reply_${id}`).value || "عذراً، تم رفض المستند لعدم مطابقة الشروط."
      });
      alert("تم رفض الطلب نهائياً وإغلاق سجله.");
    };
  </script>
</body>
</html>
