<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>إثبتلي </title>
  <style>
    :root {
  --brown: #3f5a3a;
--brown-2: #5a7a52;
--cream: #eef2e6;
      --card: #fffaf2;
      --text: #2b1c12;
      --muted: #7a6554;
      --line: #d9c7b0;
      --danger: #b42318;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: var(--cream);
      color: var(--text);
    }
    .topbar {
      background: var(--brown);
      color: #f7efe4;
      font-size: 13px;
      padding: 8px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .hero {
      background: #f7f1e6;
      padding: 22px 20px 16px;
    }
    .hero-inner, .nav-inner, .wrap, .foot-inner {
      max-width: 980px;
      margin: 0 auto;
    }
    .hero-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .logo { width: 70px; height: 70px; object-fit: contain; }
    .hero h1 { margin: 0; font-size: 32px; color: var(--brown); }
    .hero p { margin: 4px 0 0; color: var(--brown-2); }
    .nav {
      background: var(--brown);
      color: #fff;
    }
    .nav-inner {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 18px;
      padding: 10px 20px;
    }
    .nav a {
      color: #fff;
      text-decoration: none;
      font-size: 14px;
    }
    .wrap { padding: 28px 16px 40px; min-height: 42vh; }
    .notice {
      background: #f4e6cf;
      border: 1px solid #e2c9a4;
      color: #6a4a28;
      padding: 12px 14px;
      margin-bottom: 16px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      padding: 18px;
      margin: 16px 0;
    }
    input, textarea, button {
      width: 100%;
      padding: 12px;
      border-radius: 4px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      font: inherit;
      margin: 8px 0;
    }
    button {
      background: var(--brown);
      color: #fff;
      font-weight: 700;
      border: 0;
      cursor: pointer;
    }
    button.secondary { background: #8a6240; }
    .hidden { display: none; }
    .item { display: grid; grid-template-columns: 120px 1fr; gap: 12px; border-top: 1px solid var(--line); padding-top: 12px; margin-top: 12px; }
    .item img { width: 120px; height: 120px; object-fit: cover; }
    .msg { min-height: 20px; color: var(--danger); }
    footer {
      background: var(--brown);
      color: #f7efe4;
      padding: 22px 16px;
    }
    footer h3 { margin: 0 0 8px; }
    footer p { margin: 0; line-height: 1.7; color: #ead9c4; }
    #recaptcha-container { min-height: 1px; }
    @media (max-width: 640px) {
      .hero-inner { flex-direction: column; align-items: flex-start; }
      .hero h1 { font-size: 26px; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <span>مشروع جامعي</span>
    <span>إثبتلي</span>
  </div>

  <div class="hero">
    <div class="hero-inner">
      <div class="brand">
        <div>
          <h1>إثبتلي</h1>
          <p>منصة التحقق والمصداقية</p>
        </div>
      </div>
      <img class="logo" src="logo.png" alt="إثبتلي" />
    </div>
  </div>

  <nav class="nav">
    <div class="nav-inner">
      <a href="#top">الرئيسية</a>
      <a href="#authCard">تسجيل الدخول</a>
      <a href="#list">طلباتي</a>
      <a href="#about">نبذة</a>
    </div>
  </nav>

  <div class="wrap" id="top">
    <div class="notice">
    موقع للتجربة الأكاديمية فقط
    </div>

    <div id="authCard" class="card">
      <h2>تسجيل الدخول</h2>
      <input id="fullName" placeholder="الاسم الرباعي" />
      <input id="uniId" placeholder="الهوية الوطنية" />
      <input id="phone" placeholder="رقم الجوال مثل 05xxxxxxxx" />
      <button id="sendCodeBtn">إرسال رمز التحقق</button>
      <div id="codeBox" class="hidden">
        <input id="code" placeholder="رمز الرسالة" />
        <button id="verifyBtn">تأكيد الدخول</button>
      </div>
      <div id="recaptcha-container"></div>
      <div id="authMsg" class="msg"></div>
    </div>

    <div id="appCard" class="card hidden">
      <p id="who"></p>
      <button id="logoutBtn" class="secondary">خروج</button>
      <h2>رفع ملف للمراجعة</h2>
      <input id="note" placeholder="ملاحظة اختيارية" />
      <input id="file" type="file" accept="image/*" />
      <button id="uploadBtn">إرسال للمراجعة</button>
      <div id="uploadMsg" class="msg"></div>
      <h2>طلباتي</h2>
      <div id="list"></div>
    </div>
  </div>

  <footer id="about">
    <div class="foot-inner">
      <h3>نبذة عن المنصة</h3>
      <p>
        إثبتلي منصة لمراجعة الادلة المرفقة. يسجّل المستخدم بياناته ويرفع الصورة،
        ثم يراجع المشرف الطلب ويرسل الرد عبر الصفحة
      </p>
    </div>
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
    import { getAuth, RecaptchaVerifier, signInWithPhoneNumber, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";
    import { getFirestore, collection, addDoc, query, where, orderBy, onSnapshot, serverTimestamp, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDj5Hr4ONRDgEJLgRMExcYXnJnrS20ge_k",
      authDomain: "ethbatli.firebaseapp.com",
      projectId: "ethbatli",
      storageBucket: "ethbatli.firebasestorage.app",
      messagingSenderId: "824449568013",
      appId: "1:824449568013:web:f606ccd14e23463b763444",
      measurementId: "G-V5BRB4MRVQ"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    auth.languageCode = "ar";
    const db = getFirestore(app);

    function compressImage(file) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
          const max = 900;
          let w = img.width, h = img.height;
          if (w > max || h > max) {
            const s = Math.min(max / w, max / h);
            w = Math.round(w * s);
            h = Math.round(h * s);
          }
          const canvas = document.createElement("canvas");
          canvas.width = w;
          canvas.height = h;
          canvas.getContext("2d").drawImage(img, 0, 0, w, h);
          URL.revokeObjectURL(url);
          resolve(canvas.toDataURL("image/jpeg", 0.7));
        };
        img.onerror = reject;
        img.src = url;
      });
    }

    const authMsg = document.getElementById("authMsg");
    const uploadMsg = document.getElementById("uploadMsg");
    const list = document.getElementById("list");
    let confirmation = null;

    function toE164(p) {
      const raw = (p || "").trim();
      if (raw.startsWith("+") && raw.replace(/\D/g, "").length >= 10) return "+" + raw.replace(/\D/g, "");
      const d = raw.replace(/\D/g, "");
      if (d.startsWith("966")) return "+" + d;
      if (d.startsWith("1") && d.length === 11) return "+" + d;
      if (d.startsWith("05") && d.length === 10) return "+966" + d.slice(1);
      if (d.startsWith("5") && d.length === 9) return "+966" + d;
      return null;
    }

    window.recaptchaVerifier = new RecaptchaVerifier(auth, "recaptcha-container", { size: "invisible" });

    document.getElementById("sendCodeBtn").onclick = async () => {
      const name = document.getElementById("fullName").value.trim();
      const uniIdVal = document.getElementById("uniId").value.trim();
      const e164 = toE164(document.getElementById("phone").value);
      if (!name || !uniIdVal || !e164) {
        authMsg.textContent = "أكمل الاسم والهوية الوطنية والجوال.";
        return;
      }
      localStorage.setItem("profile", JSON.stringify({ name, uniId: uniIdVal, phone: e164 }));
      try {
        confirmation = await signInWithPhoneNumber(auth, e164, window.recaptchaVerifier);
        document.getElementById("codeBox").classList.remove("hidden");
        authMsg.textContent = "أدخل رمز التحقق.";
      } catch (e) {
        authMsg.textContent = e.message;
      }
    };

    document.getElementById("verifyBtn").onclick = async () => {
      try {
        await confirmation.confirm(document.getElementById("code").value.trim());
      } catch (e) {
        authMsg.textContent = "الرمز غير صحيح.";
      }
    };

    document.getElementById("logoutBtn").onclick = () => signOut(auth);

    document.getElementById("uploadBtn").onclick = async () => {
      const user = auth.currentUser;
      const file = document.getElementById("file").files[0];
      const profile = JSON.parse(localStorage.getItem("profile") || "{}");
      if (!user || !file) {
        uploadMsg.textContent = "اختر صورة بعد تسجيل الدخول";
        return;
      }
      uploadMsg.textContent = "جاري الرفع...";
      try {
        const imageUrl = await compressImage(file);
        await addDoc(collection(db, "submissions"), {
          userId: user.uid,
          fullName: profile.name || "",
          universityId: profile.uniId || "",
          phone: user.phoneNumber || profile.phone || "",
          imageUrl,
          fileName: file.name,
          note: document.getElementById("note").value || "",
          status: "pending",
          adminReply: "",
          createdAt: serverTimestamp()
        });
        uploadMsg.textContent = "تم الإرسال للمراجعة.";
        document.getElementById("file").value = "";
        document.getElementById("note").value = "";
      } catch (e) {
        uploadMsg.textContent = e.message;
      }
    };

    function statusText(s) {
      if (s === "approved") return "تمت الموافقة";
      if (s === "rejected") return "مرفوض";
      return "بانتظار المراجعة";
    }

    let unsub = null;
    onAuthStateChanged(auth, async (user) => {
      if (unsub) unsub();
      if (!user) {
        authCard.classList.remove("hidden");
        appCard.classList.add("hidden");
        return;
      }
      const profile = JSON.parse(localStorage.getItem("profile") || "{}");
      if (profile.name) {
        await setDoc(doc(db, "users", user.uid), {
          fullName: profile.name,
          universityId: profile.uniId,
          phone: user.phoneNumber
        }, { merge: true });
      }
      authCard.classList.add("hidden");
      appCard.classList.remove("hidden");
      who.textContent = (profile.name || "طالب") + " — " + (user.phoneNumber || "");
      const q = query(collection(db, "submissions"), where("userId", "==", user.uid), orderBy("createdAt", "desc"));
      unsub = onSnapshot(q, (snap) => {
        list.innerHTML = "";
        snap.forEach((d) => {
          const x = d.data();
          list.innerHTML += `<div class="item"><img src="${x.imageUrl}" alt=""><div>
            <b>${statusText(x.status)}</b>
            <p>${x.note || ""}</p>
            <p>رد المشرف: ${x.adminReply || "لا يوجد بعد"}</p>
          </div></div>`;
        });
        if (!snap.size) list.innerHTML = "<p>لا توجد طلبات</p>";
      });
    });
  </script>
</body>
</html>
